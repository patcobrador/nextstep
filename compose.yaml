name: nextstep-local

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql://nextstep:nextstep@postgres:5432/nextstep
      HOST: 0.0.0.0
      IDENTITY_ADAPTER: local-test
      LOG_FORMAT: json
      NODE_ENV: development
      PORT: 3001
      NEXTSTEP_DEMO_MODE: enabled
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_REGION: ap-southeast-2
      OBJECT_STORAGE_BUCKET: nextstep-private-evidence-local
      OBJECT_STORAGE_ACCESS_KEY: nextstep-local
      OBJECT_STORAGE_SECRET_KEY: change-me-local-only
      MEDIA_UPLOAD_GRANT_SECONDS: 900
      MEDIA_PLAYBACK_GRANT_SECONDS: 300
      MEDIA_MAXIMUM_BYTES: 157286400
      MEDIA_MAXIMUM_DURATION_MS: 90000
      MEDIA_ABANDONED_RETENTION_HOURS: 24
      MEDIA_REVIEWED_RETENTION_DAYS: 30
      MEDIA_APPEAL_WINDOW_DAYS: 14
    ports:
      - "127.0.0.1:3101:3001"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
    environment:
      NEXTSTEP_API_BASE_URL: http://api:3001/v1
      NEXTSTEP_LOCAL_AUTH: enabled
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3101/v1
      NODE_ENV: production
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgresql://nextstep:nextstep@postgres:5432/nextstep
      NODE_ENV: development
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_REGION: ap-southeast-2
      OBJECT_STORAGE_BUCKET: nextstep-private-evidence-local
      OBJECT_STORAGE_ACCESS_KEY: nextstep-local
      OBJECT_STORAGE_SECRET_KEY: change-me-local-only
      MEDIA_UPLOAD_GRANT_SECONDS: 900
      MEDIA_PLAYBACK_GRANT_SECONDS: 300
      MEDIA_MAXIMUM_BYTES: 157286400
      MEDIA_MAXIMUM_DURATION_MS: 90000
      MEDIA_ABANDONED_RETENTION_HOURS: 24
      MEDIA_REVIEWED_RETENTION_DAYS: 30
      MEDIA_APPEAL_WINDOW_DAYS: 14
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nextstep
      POSTGRES_USER: nextstep
      POSTGRES_PASSWORD: nextstep
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextstep -d nextstep"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - nextstep_postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nextstep-local
      MINIO_ROOT_PASSWORD: change-me-local-only
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:3100,http://localhost:3100,http://127.0.0.1:3130,http://127.0.0.1:3140
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - nextstep_minio:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 nextstep-local change-me-local-only &&
        mc mb --ignore-existing local/nextstep-private-evidence-local &&
        mc anonymous set none local/nextstep-private-evidence-local

volumes:
  nextstep_postgres:
  nextstep_minio:

name: nextstep-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nextstep
      POSTGRES_USER: nextstep
      POSTGRES_PASSWORD: nextstep
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextstep -d nextstep"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - nextstep_postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nextstep-local
      MINIO_ROOT_PASSWORD: change-me-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - nextstep_minio:/data

volumes:
  nextstep_postgres:
  nextstep_minio:

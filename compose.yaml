name: nextstep-local

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql://nextstep:nextstep@postgres:5432/nextstep
      HOST: 0.0.0.0
      IDENTITY_ADAPTER: local-test
      LOG_FORMAT: json
      NODE_ENV: development
      PORT: 3001
    ports:
      - "127.0.0.1:3101:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3101/v1
      NODE_ENV: production
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nextstep
      POSTGRES_USER: nextstep
      POSTGRES_PASSWORD: nextstep
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextstep -d nextstep"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - nextstep_postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nextstep-local
      MINIO_ROOT_PASSWORD: change-me-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - nextstep_minio:/data

volumes:
  nextstep_postgres:
  nextstep_minio:

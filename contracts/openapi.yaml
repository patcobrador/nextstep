openapi: 3.1.0
info:
  title: Next Step Sports Platform API
  version: 1.0.0-draft
  description: |
    Initial agent-build contract for the Next Step Sports Platform.
    This contract is a starting skeleton and must remain aligned with the
    business/product specification and accepted ADRs.
servers:
  - url: https://api.staging.nextstep.example/v1
    description: Staging
  - url: http://localhost:3001/v1
    description: Local
security:
  - oidc: []
tags:
  - name: Observability
  - name: Identity
  - name: Athletes
  - name: Progress
  - name: Practice
  - name: Evidence
  - name: Assessments
  - name: Passport
  - name: Bookings
  - name: Billing
  - name: Admin Curriculum
paths:
  /health/live:
    get:
      tags: [Observability]
      operationId: getLiveness
      summary: Confirm that the API process is alive
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        default:
          $ref: "#/components/responses/Problem"

  /health/ready:
    get:
      tags: [Observability]
      operationId: getReadiness
      summary: Confirm that required API dependencies are available
      security: []
      responses:
        "200":
          description: API is ready
          content:
            application/json:
              schema:
                type: object
                required: [status, dependencies]
                properties:
                  status:
                    type: string
                    const: ready
                  dependencies:
                    type: object
                    additionalProperties:
                      type: string
        default:
          $ref: "#/components/responses/Problem"

  /me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Return the authenticated user and authorised household context
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        default:
          $ref: "#/components/responses/Problem"

  /households/{householdId}/athletes:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [Athletes]
      operationId: listAthletes
      summary: List active and optionally archived athletes in the household
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Athlete list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Athlete"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Athletes]
      operationId: createAthlete
      summary: Create a parent-controlled private athlete profile
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAthleteRequest"
      responses:
        "201":
          description: Athlete created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Athlete"
        default:
          $ref: "#/components/responses/Problem"

  /households/{householdId}/consents:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [Identity]
      operationId: recordConsent
      summary: Record a versioned, purpose-specific adult consent decision
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordConsentRequest"
      responses:
        "201":
          description: Consent decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"
        default:
          $ref: "#/components/responses/Problem"

  /consents/{consentId}/withdraw:
    parameters:
      - $ref: "#/components/parameters/ConsentId"
    post:
      tags: [Identity]
      operationId: withdrawConsent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Consent withdrawal recorded without deleting history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"
        default:
          $ref: "#/components/responses/Problem"
  /athletes/{athleteId}:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    get:
      tags: [Athletes]
      operationId: getAthlete
      responses:
        "200":
          description: Athlete profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Athlete"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Athletes]
      operationId: updateAthlete
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdateAthleteRequest"
      responses:
        "200":
          description: Athlete updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Athlete"
        default:
          $ref: "#/components/responses/Problem"

  /athletes/{athleteId}/baseline:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    post:
      tags: [Athletes]
      operationId: submitBaseline
      summary: Submit baseline inputs and assign a recommended starting campaign
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaselineRequest"
      responses:
        "200":
          description: Baseline result and campaign recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaselineResult"
        default:
          $ref: "#/components/responses/Problem"

  /athletes/{athleteId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    get:
      tags: [Progress]
      operationId: getAthleteDashboard
      summary: Return the athlete's single primary next action and concise progress context
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteDashboard"
        default:
          $ref: "#/components/responses/Problem"

  /athletes/{athleteId}/skill-tree:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    get:
      tags: [Progress]
      operationId: getSkillTree
      parameters:
        - name: domainKey
          in: query
          schema:
            type: string
        - name: stageKey
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Athlete-specific curriculum tree and progress state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillTree"
        default:
          $ref: "#/components/responses/Problem"

  /athletes/{athleteId}/skills/{nodeId}:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
      - $ref: "#/components/parameters/NodeId"
    get:
      tags: [Progress]
      operationId: getAthleteSkillDetail
      summary: Return contextual skill content, progress and remaining requirements
      responses:
        "200":
          description: Athlete-specific skill detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteSkillDetail"
        default:
          $ref: "#/components/responses/Problem"

  /athletes/{athleteId}/branch-selections:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    post:
      tags: [Progress]
      operationId: selectCampaignBranch
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchGroupKey, selectedNodeId]
              properties:
                branchGroupKey:
                  type: string
                selectedNodeId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Updated branch and next action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteDashboard"
        default:
          $ref: "#/components/responses/Problem"

  /athletes/{athleteId}/practice-plans:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    post:
      tags: [Practice]
      operationId: generatePracticePlan
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePracticePlanRequest"
      responses:
        "201":
          description: Persisted practice plan snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticePlan"
        default:
          $ref: "#/components/responses/Problem"

  /practice-plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      tags: [Practice]
      operationId: getPracticePlan
      responses:
        "200":
          description: Practice plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticePlan"
        default:
          $ref: "#/components/responses/Problem"

  /practice-plans/{planId}/sessions:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      tags: [Practice]
      operationId: startPracticeSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clientSessionId:
                  type: string
                startedOffline:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Practice session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSession"
        default:
          $ref: "#/components/responses/Problem"

  /practice-sessions/{sessionId}/attempts:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Practice]
      operationId: recordPracticeAttempt
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeAttemptRequest"
      responses:
        "201":
          description: Attempt recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeAttempt"
        default:
          $ref: "#/components/responses/Problem"

  /practice-sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Practice]
      operationId: getPracticeSession
      summary: Retrieve resumable practice-session state
      responses:
        "200":
          description: Current session and recorded attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSessionDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Practice]
      operationId: updatePracticeSession
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdatePracticeSessionRequest"
      responses:
        "200":
          description: Session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSession"
        default:
          $ref: "#/components/responses/Problem"

  /practice-sessions/{sessionId}/complete:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Practice]
      operationId: completePracticeSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletePracticeSessionRequest"
      responses:
        "200":
          description: Completion result and progress changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeCompletionResult"
        default:
          $ref: "#/components/responses/Problem"

  /evidence/upload-intents:
    post:
      tags: [Evidence]
      operationId: createEvidenceUploadIntent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadIntentRequest"
      responses:
        "201":
          description: Short-lived private upload intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadIntent"
        default:
          $ref: "#/components/responses/Problem"

  /evidence/upload-intents/{mediaAssetId}/complete:
    parameters:
      - $ref: "#/components/parameters/MediaAssetId"
    post:
      tags: [Evidence]
      operationId: completeEvidenceUpload
      summary: Finalise a direct private upload and queue media validation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteEvidenceUploadRequest"
      responses:
        "202":
          description: Upload accepted for private validation and processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        default:
          $ref: "#/components/responses/Problem"

  /evidence-submissions:
    post:
      tags: [Evidence]
      operationId: submitEvidence
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEvidenceRequest"
      responses:
        "201":
          description: Evidence submitted and assessment requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSubmission"
        default:
          $ref: "#/components/responses/Problem"

  /evidence-submissions/{evidenceId}:
    parameters:
      - $ref: "#/components/parameters/EvidenceId"
    get:
      tags: [Evidence]
      operationId: getEvidenceSubmission
      responses:
        "200":
          description: Evidence state and authorised playback details when available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSubmission"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Evidence]
      operationId: requestEvidenceDeletion
      summary: Request worker-driven deletion of private evidence
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Deletion workflow accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSubmission"
        default:
          $ref: "#/components/responses/Problem"

  /evidence-submissions/{evidenceId}/playback-grants:
    parameters:
      - $ref: "#/components/parameters/EvidenceId"
    post:
      tags: [Evidence]
      operationId: createEvidencePlaybackGrant
      summary: Create a short-lived, audited playback grant after object authorisation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Short-lived playback grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackGrant"
        default:
          $ref: "#/components/responses/Problem"

  /coach/assessment-queue:
    get:
      tags: [Assessments]
      operationId: getCoachAssessmentQueue
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Assigned assessments ordered by due time
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AssessmentSummary"
                  nextCursor:
                    type: [string, "null"]
        default:
          $ref: "#/components/responses/Problem"

  /coach/assessments/{assessmentId}:
    parameters:
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [Assessments]
      operationId: getCoachAssessment
      responses:
        "200":
          description: Assigned assessment, rubric and short-lived media access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        default:
          $ref: "#/components/responses/Problem"

  /coach/assessments/{assessmentId}/decision:
    parameters:
      - $ref: "#/components/parameters/AssessmentId"
    post:
      tags: [Assessments]
      operationId: submitAssessmentDecision
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentDecisionRequest"
      responses:
        "200":
          description: Assessment completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"
        default:
          $ref: "#/components/responses/Problem"

  /assessments/{assessmentId}/appeals:
    parameters:
      - $ref: "#/components/parameters/AssessmentId"
    post:
      tags: [Assessments]
      operationId: appealAssessment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        "201":
          description: Appeal opened
        default:
          $ref: "#/components/responses/Problem"

  /athletes/{athleteId}/passport:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    get:
      tags: [Passport]
      operationId: getAthletePassport
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Private athlete passport and timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthletePassport"
        default:
          $ref: "#/components/responses/Problem"

  /bookings:
    post:
      tags: [Bookings]
      operationId: createBooking
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created, possibly pending payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        default:
          $ref: "#/components/responses/Problem"

  /orders:
    post:
      tags: [Billing]
      operationId: createOrder
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order and payment client secret/reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        default:
          $ref: "#/components/responses/Problem"

  /webhooks/stripe:
    post:
      tags: [Billing]
      operationId: receiveStripeWebhook
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Webhook accepted or already processed
        "400":
          description: Invalid signature or payload

  /admin/curricula:
    post:
      tags: [Admin Curriculum]
      operationId: createCurriculumDraft
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCurriculumRequest"
      responses:
        "201":
          description: Curriculum draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumVersion"
        default:
          $ref: "#/components/responses/Problem"

  /admin/curricula/{curriculumId}/validate:
    parameters:
      - $ref: "#/components/parameters/CurriculumId"
    post:
      tags: [Admin Curriculum]
      operationId: validateCurriculum
      responses:
        "200":
          description: Graph/content validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumValidationReport"
        default:
          $ref: "#/components/responses/Problem"

  /admin/curricula/{curriculumId}/publish:
    parameters:
      - $ref: "#/components/parameters/CurriculumId"
    post:
      tags: [Admin Curriculum]
      operationId: publishCurriculum
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvalToken]
              properties:
                approvalToken:
                  type: string
                effectiveFrom:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Published immutable curriculum version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumVersion"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example/.well-known/openid-configuration

  parameters:
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AthleteId:
      name: athleteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NodeId:
      name: nodeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConsentId:
      name: consentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaAssetId:
      name: mediaAssetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CurriculumId:
      name: curriculumId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string

  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    CurrentUser:
      type: object
      required: [id, roles, households]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: [string, "null"] }
        roles:
          type: array
          items: { type: string }
        households:
          type: array
          items:
            type: object
            required: [id, role]
            properties:
              id: { type: string, format: uuid }
              name: { type: [string, "null"] }
              role: { type: string }

    Athlete:
      type: object
      required: [id, householdId, displayName, ageBand, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        ageBand: { type: string, examples: ["U10"] }
        birthMonth: { type: [integer, "null"], minimum: 1, maximum: 12 }
        birthYear: { type: [integer, "null"], minimum: 2000, maximum: 2030 }
        laterality: { type: [string, "null"] }
        status: { type: string, enum: [ACTIVE, ARCHIVED, DELETION_PENDING] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateAthleteRequest:
      type: object
      required: [displayName, ageBand, consents]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        ageBand: { type: string }
        birthMonth: { type: integer, minimum: 1, maximum: 12 }

        versionKey: { type: string }
        name: { type: string }
        cloneFromVersionId: { type: [string, "null"], format: uuid }

    CurriculumVersion:
      type: object
      required: [id, sportKey, versionKey, name, status]
      properties:
        id: { type: string, format: uuid }
        sportKey: { type: string }
        versionKey: { type: string }
        name: { type: string }
        status: { type: string, enum: [DRAFT, VALIDATING, APPROVED, PUBLISHED, RETIRED] }
        effectiveFrom: { type: [string, "null"], format: date-time }
        publishedAt: { type: [string, "null"], format: date-time }

    CurriculumValidationReport:
      type: object

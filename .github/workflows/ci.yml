name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nextstep
          POSTGRES_USER: nextstep
          POSTGRES_PASSWORD: nextstep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextstep -d nextstep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nextstep:nextstep@localhost:5432/nextstep
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@11.18.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm contracts:lint
      - run: pnpm contracts:check-generated
      - run: pnpm curriculum:validate
      - run: pnpm prisma:validate
      - run: pnpm prisma:migrate:diff
      - run: pnpm prisma:migrate:deploy
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:contract
      - run: pnpm test:authz
      - run: pnpm test:security
      - run: pnpm test:a11y
      - run: pnpm test:e2e:walking-skeleton
      - run: pnpm build
      - run: pnpm --filter @nextstep/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e:checkpoint-a
      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: apps/web/.playwright-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - run: docker compose config --quiet
      - name: Build API image
        id: docker_build_api
        shell: bash
        run: |
          set -o pipefail
          docker compose --progress=plain build api 2>&1 | tee "$RUNNER_TEMP/docker-build-api.log"
      - name: Upload API Docker build log
        if: ${{ failure() && steps.docker_build_api.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-api-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-build-api.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build web image
        id: docker_build_web
        shell: bash
        run: |
          set -o pipefail
          docker compose --progress=plain build web 2>&1 | tee "$RUNNER_TEMP/docker-build-web.log"
      - name: Upload web Docker build log
        if: ${{ failure() && steps.docker_build_web.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-web-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-build-web.log
          if-no-files-found: ignore
          retention-days: 7

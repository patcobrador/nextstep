name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nextstep
          POSTGRES_USER: nextstep
          POSTGRES_PASSWORD: nextstep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextstep -d nextstep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nextstep:nextstep@localhost:5432/nextstep
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@11.18.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm contracts:lint
      - run: pnpm contracts:check-generated
      - run: pnpm curriculum:validate
      - run: pnpm prisma:validate
      - run: pnpm prisma:migrate:diff
      - run: pnpm prisma:migrate:deploy
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:contract
      - run: pnpm test:authz
      - run: pnpm test:a11y
      - run: pnpm test:e2e:walking-skeleton
      - run: pnpm build
      - run: pnpm --filter @nextstep/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e:checkpoint-a
      - run: docker compose config --quiet
      - run: docker compose build api web
